<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pembuat Laporan Kegiatan · BHP Medan</title>
<style>
:root {
  --bg: #eef0f3; --panel: #fff; --line: #e2ddd5; --fg: #1f2733; --muted: #5d6573;
  --gold: #a8822f; --maroon: #6e1d29; --maroon-2: #4f1520; --faint: #f6f4f1;
  --ok: #1f6b3b; --bad: #9b2226; --warn: #8a6a24;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 "Segoe UI", Calibri, Arial, sans-serif; }
.topbar { background: linear-gradient(180deg, var(--maroon), var(--maroon-2)); color: #fff; border-bottom: 3px solid var(--gold); }
.topbar .in { max-width: 1560px; margin: 0 auto; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.topbar .t1 { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: #f0dfb6; font-weight: 700; }
.topbar .t2 { font: 700 19px Georgia, Cambria, serif; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--fg); padding: 7px 12px; font-weight: 600; font-size: 13.5px; }
button:hover { background: var(--faint); }
button:disabled { opacity: .4; cursor: default; }
button.pri { background: var(--gold); border-color: var(--gold); color: #fff; }
button.pri:hover { background: #8a6a24; }
button.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.45); }
button.ghost:hover { background: rgba(255,255,255,.12); }
button.sm { padding: 4px 9px; font-size: 12.5px; }
button.del { color: var(--bad); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.wrap { max-width: 1560px; margin: 0 auto; padding: 16px 20px 40px; display: grid; grid-template-columns: minmax(340px, 560px) minmax(0, 1fr); gap: 18px; align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(31,39,51,.06); }
.card > h2 { margin: 0 0 6px; font: 700 16px Georgia, Cambria, serif; color: var(--maroon); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 8px 0 3px; }
label.chk { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--fg); }
label.chk input { width: auto; }
input, select, textarea { width: 100%; font: inherit; padding: 7px 9px; border: 1px solid #cfc9be; border-radius: 7px; background: #fff; color: var(--fg); }
textarea { min-height: 76px; resize: vertical; }
textarea.tall { min-height: 150px; }
.row { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
.row4 { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
.item { border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 9px; padding: 10px 12px 12px; margin-top: 10px; background: var(--faint); }
.item.ok { border-left-color: var(--ok); } .item.bad { border-left-color: var(--bad); } .item.warn { border-left-color: var(--warn); }
.item h3 { margin: 0; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.item h3 span.b { display: flex; gap: 4px; }
.hint { font-size: 12.5px; color: var(--muted); margin: 4px 0 0; }
.count { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.count input { width: 80px; }
.ovh { display: flex; justify-content: space-between; align-items: end; gap: 8px; }
.tag { font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: #e6f1ea; color: var(--ok); }
.tag.man { background: #f6ecd6; color: var(--warn); }
.thumb { max-width: 140px; max-height: 100px; border-radius: 6px; border: 1px solid var(--line); display: block; margin-top: 6px; }
.preview { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; padding: 4px; }

/* ---- kertas ---- */
.paper { background: #fff; width: 210mm; max-width: 100%; margin: 0 auto; padding: 20mm 20mm 25mm 30mm; box-shadow: 0 6px 24px rgba(31,39,51,.18); color: #000; font: 12pt/1.5 Arial, Helvetica, sans-serif; }
.paper p { margin: 0 0 6pt; text-align: justify; }
.paper .ph { color: #c00000; }
.paper .ctr, .paper .ctr p { text-align: center; }
.paper .pb { border-top: 2px dashed #b9b2a4; margin: 18mm -20mm 18mm -30mm; height: 0; }
.paper .cover { text-align: center; min-height: 240mm; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
.paper table { border-collapse: collapse; }
.paper table.b td, .paper table.b th { border: 1px solid #000; padding: 3pt 5pt; vertical-align: top; font-size: 10pt; text-align: left; }
.paper table.b th { text-align: center; }
.paper table.kop { width: 100%; border-bottom: 3px double #000; margin-bottom: 14pt; }
.paper table.kop td { vertical-align: middle; text-align: center; padding-bottom: 6pt; line-height: 1.2; }
.paper table.ttd { width: 100%; margin-top: 10pt; }
.paper table.ttd td { width: 50%; vertical-align: top; text-align: center; padding: 0 6pt; }
.paper table.foto { width: 100%; }
.paper table.foto td { width: 50%; vertical-align: top; text-align: center; padding: 4pt 5pt 10pt; font-size: 9pt; line-height: 1.3; }
.paper table.foto img { max-width: 100%; height: auto; }
@media (max-width: 1000px) { .wrap { grid-template-columns: 1fr; } .preview { position: static; max-height: none; } .paper { padding: 12mm; } .paper .pb { margin: 12mm -12mm; } }
@media print {
  @page { size: A4; margin: 20mm 20mm 25mm 30mm; }
  body { background: #fff; } .topbar, .form { display: none !important; }
  .wrap { display: block; padding: 0; max-width: none; } .preview { position: static; max-height: none; overflow: visible; padding: 0; }
  .paper { box-shadow: none; width: auto; padding: 0; }
  .paper .pb { border: 0; margin: 0; break-after: page; }
  .paper tr, .paper table.ttd, .paper table.foto td { break-inside: avoid; }
}
</style>
</head>

var UMUM_WALI = [
  "Perwalian (voogdij) merupakan instrumen perlindungan hukum yang sangat penting dalam ruang lingkup hukum perdata di Indonesia. Hal ini merupakan wujud tanggung jawab negara untuk memberikan perlindungan dan pemenuhan hak keperdataan bagi anak di bawah umur yang tidak lagi berada di bawah kekuasaan orang tuanya. Secara hukum, anak yang belum berusia 18 (delapan belas) tahun atau belum menikah dianggap belum cakap bertindak secara mandiri dalam suatu perbuatan hukum (handelingsonbekwaam). Oleh karena itu, seluruh perbuatan hukum yang berkaitan dengan pemeliharaan diri, pendidikan, dan pengurusan harta kekayaannya harus diwakili oleh seorang wali yang ditunjuk sah melalui penetapan pengadilan, demi kepentingan terbaik bagi anak (the best interest of the child).",

var KEY = "bhp-laporan-kegiatan-v2";
function penetapanBaru() {
  return { jenis: "perwalian", pn: "", nomor: "", tgl: "", wali: "", hubungan: "", anak: "", alamat: "", latar: "",
    hasil: "berhasil_pnbp", sub: "", subLain: "", ba: "", harta: "", nilai: "", pnbp: "" };
}
function kosong(lama) {
  lama = lama || {};
  return {
    jenis: lama.jenis || "penyumpahan", sampul: lama.sampul !== false,
    tglKegiatan: "", tglLaporan: "", kota: "Medan",
    stNomor: "", stTanggal: "", dipaNomor: lama.dipaNomor || "", dipaTanggal: lama.dipaTanggal || "",
    tim: lama.tim || [{ nama: "", pangkat: "", nip: "", jabatan: "" }], pj: lama.pj || 0,
    kepala: lama.kepala || "",
    penetapan: [penetapanBaru()],
    judulLain: "", objek: "",
    krono: [{ jam: "", jam2: "", lokasi: "", uraian: "", foto: "", fw: 0, fh: 0, ket: "" }],
    ov: {}
  };
}
var S = kosong();
try { var sv = JSON.parse(localStorage.getItem(KEY)); if (sv && sv.tim && sv.penetapan) S = Object.assign(kosong(), sv); } catch (e) {}
function simpan() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { try { var c = JSON.parse(JSON.stringify(S)); c.krono.forEach(function (k) { k.foto = ""; }); localStorage.setItem(KEY, JSON.stringify(c)); } catch (e2) {} }
}

/* ---------- util ---------- */
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function R(s) { return esc(s).replace(/\[[^\[\]]{2,40}\]/g, '<span class="ph">$&</span>'); }   /* [isian kosong] ditandai merah */
function ph(s, nama) { s = String(s == null ? "" : s).trim(); return s || "[" + nama + "]"; }
var BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
var HARI = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
function pecah(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function tgl(iso, nama) { var d = pecah(iso); return d ? d.getDate() + " " + BULAN[d.getMonth()] + " " + d.getFullYear() : "[" + (nama || "tanggal") + "]"; }
function hari(iso) { var d = pecah(iso); return d ? HARI[d.getDay()] : "[hari]"; }
function jam(s) { return String(s || "").replace(":", "."); }
function angka(s) { return parseInt(String(s || "").replace(/\D/g, ""), 10) || 0; }
function rp(n) { return "Rp" + angka(n).toLocaleString("id-ID"); }
function bil(n) {
  var s = ["nol", "satu", "dua", "tiga", "empat", "lima", "enam", "tujuh", "delapan", "sembilan", "sepuluh", "sebelas"];
  if (n < 12) return s[n]; if (n < 20) return s[n - 10] + " belas";
  if (n < 100) return s[Math.floor(n / 10)] + " puluh" + (n % 10 ? " " + s[n % 10] : ""); return String(n);
}
function nb(n) { return n + " (" + bil(n) + ")"; }
function kecil(s) { return s.charAt(0).toLowerCase() + s.slice(1); }
function hasilOf(id) { return HASIL.filter(function (h) { return h.id === id; })[0] || HASIL[0]; }
function jenisOf(id) { return JENIS.filter(function (j) { return j.id === id; })[0] || JENIS[0]; }
function get(path) { return path.split(".").reduce(function (o, k) { return o == null ? o : o[k]; }, S); }
function set(path, val) { var ks = path.split("."), last = ks.pop(); ks.reduce(function (o, k) { return o[k]; }, S)[last] = val; }
function baris(s) { return String(s || "").split(/\n+/).map(function (x) { return x.trim(); }).filter(Boolean); }

/* istilah per jenis perkara */
function ist(p) {
  return p.jenis === "pengampuan"
    ? { W: "Pengampu", a: "terampu", atas: "atas diri", perkara: "pengampuan", pengawas: "pengampu pengawas", ba: "Berita Acara Pengambilan Sumpah Pengampu" }
    : { W: "Wali", a: "anak", atas: "atas diri anak bernama", perkara: "perwalian", pengawas: "wali pengawas (toeziende voogd)", ba: "Berita Acara Pengambilan Sumpah Wali" };
}

      } else if (hs.id === "ditunda") { p.sub = "__lain"; h += inp("Alasan penundaan (opsional)", k + "subLain"); }
      if (hs.sukses) h += inp("Nomor " + t.ba, k + "ba", "text", 'placeholder="W.2.AHU.AHU.1-AH.06.03-…"');
      if (hs.pnbp) h += inp("Uraian harta yang dicatat", k + "harta", "text", 'placeholder="sebidang tanah dan bangunan seluas ± 140 m² di …"') + '<div class="row">' + inp("Nilai harta (Rp)", k + "nilai", "text", 'inputmode="numeric"') + inp("PNBP (Rp)", k + "pnbp", "text", 'inputmode="numeric"') + "</div>";
      h += "</div>";
    });
    h += "</div>";
  } else {
    h += '<div class="card"><h2>4. Objek Kegiatan</h2>' + inp("Judul laporan (kosong = bawaan)", "judulLain", "text", 'placeholder="' + esc(jenisOf(S.jenis).judul) + '"') +
      area("Dasar perkara / objek (putusan, penetapan, surat) — opsional", "objek", "mis. Putusan Pengadilan Niaga pada Pengadilan Negeri Medan Nomor: … tanggal …") + "</div>";
  }

  h += '<div class="card"><h2>5. Kronologi Kegiatan <button class="sm" data-act="addKr">+ Tambah</button></h2>' +
    (peny ? '<button class="sm" data-act="autoKr">Susun kronologi otomatis dari data penetapan</button><p class="hint">Hasilnya draf yang bisa diedit. Klik lagi bila data penetapan berubah. Lokasi tiap butir otomatis menjadi daftar "Tempat Kegiatan".</p>' : '<p class="hint">Lokasi tiap butir otomatis menjadi daftar "Tempat Kegiatan".</p>');
  S.krono.forEach(function (kr, i) {
    var k = "krono." + i + ".";
    h += '<div class="item"><h3>Butir ' + (i + 1) + '<span class="b"><button class="sm" data-act="upKr" data-i="' + i + '"' + (i ? "" : " disabled") + '>↑</button><button class="sm" data-act="dnKr" data-i="' + i + '"' + (i < S.krono.length - 1 ? "" : " disabled") + '>↓</button>' +
      '<button class="sm del" data-act="delKr" data-i="' + i + '"' + (S.krono.length < 2 ? " disabled" : "") + ">Hapus</button></span></h3>" +
      '<div class="row">' + inp("Pukul", k + "jam", "time") + inp("s.d. (opsional)", k + "jam2", "time") + "</div>" + inp("Lokasi", k + "lokasi") +
      area("Uraian (setelah “Pada pukul … WIB,”)", k + "uraian", "Tim tiba di …") +
      '<label>Foto dokumentasi</label><input type="file" accept="image/*" data-foto="' + i + '">' +
      (kr.foto ? '<img class="thumb" src="' + kr.foto + '" alt=""><div class="row" style="align-items:end">' + inp("Keterangan foto", k + "ket") + '<button class="sm del" data-act="delFoto" data-i="' + i + '">Hapus foto</button></div>' : "") + "</div>";
  });
  h += "</div>";

  h += '<div class="card"><h2>6. Naskah Laporan</h2><p class="hint">Disusun otomatis dari isian di atas. Mengetik di kotak mana pun menjadikannya manual (tidak lagi mengikuti isian).</p>' +
    ovArea("A.1 Umum", "umum", "Satu paragraf per baris.", true) + ovArea("A.2 Maksud dan Tujuan", "maksud", "Satu butir per baris.") + ovArea("A.4 Dasar", "dasar", "Satu butir per baris.") +
    ovArea("C. Hasil yang Dicapai", "hasil", "Satu butir per baris.") + ovArea("D.1 Simpulan", "simpulan") + ovArea("D.2 Saran", "saran") + "</div>";

  document.getElementById("form").innerHTML = h;
}

/* =====================================================================
   PRATINJAU LAPORAN (struktur mengikuti template BHP Medan)
   ===================================================================== */
function P(indent, html, extra) { return '<p style="margin-left:' + indent + "cm;" + (extra || "") + '">' + html + "</p>"; }
function LI(indent, mark, text) { return '<p style="margin-left:' + indent + "cm;text-indent:-0.75cm\">" + mark + '<span style="display:inline-block;width:' + (0.75 - 0.2 * mark.length).toFixed(2) + 'cm"></span>' + R(text) + "</p>"; }
function Hd(indent, mark, text) { return '<p style="margin-left:' + indent + 'cm;text-indent:-0.75cm;margin-top:8pt;text-align:left"><b>' + mark + '<span style="display:inline-block;width:' + (0.75 - 0.2 * mark.length).toFixed(2) + 'cm"></span>' + esc(text) + "</b></p>"; }
function abc(i) { return String.fromCharCode(97 + i) + "."; }
var PB = '<div class="pb"></div><br clear="all" style="page-break-before:always;mso-break-type:section-break">';

function buildPaper(word) {
  var peny = S.jenis === "penyumpahan", h = "", ob = objekJudul(), tLap = S.tglLaporan || S.tglKegiatan, d = pecah(tLap);
  var logo = function (w) { return '<img src="' + (word ? "logo.png" : LOGO) + '" width="' + w + '" height="' + Math.round(w * 1.1) + '" alt="Logo">'; };
  var objHtml = ob.length > 1 ? ob.map(function (o, i) { return (i + 1) + ". " + R(o); }).join("<br>") : R(ob[0] || "");
  var judulHtml = "<b>" + esc(judul()) + (ob.length ? " BERDASARKAN:" : "") + "</b>";

  if (S.sampul) {
    h += '<div class="cover ctr"><div><p class="ctr" style="font-size:16pt;margin-bottom:0"><b>LAPORAN</b></p><p class="ctr"><b>TENTANG</b></p><p class="ctr" style="font-size:13pt">' + judulHtml + '</p><p class="ctr">' + objHtml + "</p>" +
      '<p class="ctr" style="margin-top:18pt">' + esc(S.kota) + ", " + R(tgl(tLap, "tanggal laporan")) + '</p></div><div style="margin:30pt 0">' + logo(150) + "</div>" +
      '<div><p class="ctr" style="margin:0"><b>' + KOP.l1 + '</b></p><p class="ctr" style="margin:0"><b>' + KOP.l2 + '</b></p><p class="ctr" style="margin:0"><b>' + KOP.l3 + '</b></p><p class="ctr"><b>' + (d ? d.getFullYear() : "") + "</b></p></div></div>" + PB;
  }

  h += '<table class="kop"><tr><td style="width:80px">' + logo(70) + '</td><td><div style="font-size:13pt"><b>' + KOP.l1 + '</b></div><div style="font-size:12pt"><b>' + KOP.l2 + '</b></div><div style="font-size:12pt"><b>' + KOP.l3 + "</b></div>" +
    '<div style="font-size:9pt">' + KOP.alamat.map(esc).join("<br>") + "</div></td></tr></table>";
  h += '<p class="ctr" style="margin:0"><b>LAPORAN</b></p><p class="ctr" style="margin:0"><b>TENTANG</b></p><p class="ctr" style="margin:0">' + judulHtml + '</p><p class="ctr" style="margin-bottom:14pt">' + objHtml + "</p>";

  /* A. Pendahuluan */
  h += Hd(0.75, "A.", "Pendahuluan");
  h += Hd(1.5, "1.", "Umum") + baris(T("umum")).map(function (s) { return P(1.5, R(s)); }).join("");
  h += Hd(1.5, "2.", "Maksud dan Tujuan") + P(1.5, "Kegiatan " + R(namaKegiatan()) + " ini memiliki maksud dan tujuan sebagai berikut:") + baris(T("maksud")).map(function (s, i) { return LI(2.25, abc(i), s); }).join("");
  h += Hd(1.5, "3.", "Ruang Lingkup") + P(1.5, "Ruang lingkup kegiatan " + R(namaKegiatan()) + " ini adalah sebagai berikut:");
  var pj = S.tim[+S.pj] || S.tim[0];
  h += Hd(2.25, "a.", "Penanggung Jawab") + P(2.25, "Penanggung jawab kegiatan ini adalah " + R(ph(pj.nama, "nama penanggung jawab")) + (pj.nip.trim() ? " (NIP. " + esc(pj.nip.trim()) + ")" : "") + ", " + R(ph(pj.jabatan, "jabatan")) + " pada Balai Harta Peninggalan Medan.");
  var tp = tempat();
  h += Hd(2.25, "b.", "Tempat Kegiatan") + P(2.25, "Kegiatan ini dilaksanakan pada:") +
    '<table style="margin-left:2.25cm"><tr><td style="width:3.2cm;vertical-align:top">Hari / Tanggal</td><td style="width:.4cm;vertical-align:top">:</td><td>' + R(hari(S.tglKegiatan) + " / " + tgl(S.tglKegiatan, "tanggal kegiatan")) + "</td></tr>" +
    '<tr><td style="vertical-align:top">Tempat</td><td style="vertical-align:top">:</td><td>' + (tp.length === 1 ? R(tp[0]) : tp.length ? "" : R("[isi lokasi pada kronologi]")) + "</td></tr></table>" +
    (tp.length > 1 ? tp.map(function (s, i) { return LI(3, (i + 1) + ".", s + (i === tp.length - 1 ? "." : i === tp.length - 2 ? "; dan" : ";")); }).join("") : "");
  h += Hd(2.25, "c.", "Pegawai yang Ditunjuk") + P(2.25, "Pegawai yang ditunjuk untuk melaksanakan kegiatan berdasarkan Surat Tugas Nomor: " + R(ph(S.stNomor, "nomor surat tugas")) + " tanggal " + R(tgl(S.stTanggal, "tanggal surat tugas")) + ", di antaranya:") +
    '<table class="b" style="margin-left:2.25cm;margin-bottom:8pt"><tr><th>No.</th><th>Nama</th><th>Pangkat / Gol.</th><th>NIP</th><th>Jabatan</th></tr>' +
    S.tim.map(function (t, i) { return "<tr><td>" + (i + 1) + ".</td><td>" + R(ph(t.nama, "nama")) + "</td><td>" + esc(t.pangkat) + "</td><td>" + esc(t.nip) + "</td><td>" + esc(t.jabatan) + "</td></tr>"; }).join("") + "</table>";
  h += Hd(1.5, "4.", "Dasar") + baris(T("dasar")).map(function (s, i) { return LI(2.25, abc(i), s); }).join("");

  /* B. Kegiatan */
  h += Hd(0.75, "B.", "Kegiatan yang Dilaksanakan");
  var kr = S.krono.filter(function (k) { return k.uraian.trim(); });
  h += kr.length ? kr.map(function (k) {
    var w = k.jam ? "Pada pukul " + jam(k.jam) + (k.jam2 ? " hingga " + jam(k.jam2) : "") + " WIB, " : "";
    return LI(1.5, "-", w + k.uraian.trim());
  }).join("") : P(0.75, R("[isi kronologi kegiatan]"));

  /* C. Hasil */
  h += Hd(0.75, "C.", "Hasil yang Dicapai") + P(0.75, "Berdasarkan serangkaian kegiatan di atas, hasil yang dicapai oleh Tim adalah sebagai berikut:") + baris(T("hasil")).map(function (s, i) { return LI(1.5, (i + 1) + ".", s); }).join("");
  if (peny && S.penetapan.length > 1) {
    var tot = 0;
    h += P(0.75, "Rekapitulasi hasil pelaksanaan:") + '<table class="b" style="margin-left:.75cm;margin-bottom:8pt"><tr><th>No.</th><th>Nomor Penetapan</th><th>Wali / Pengampu</th><th>Hasil</th><th>PNBP</th></tr>' +
      S.penetapan.map(function (p, i) {
        var hs = hasilOf(p.hasil), n = hs.pnbp ? angka(p.pnbp) : 0, al = hs.sub ? alasan(p) : ""; tot += n;
        return "<tr><td>" + (i + 1) + ".</td><td>" + R(ph(p.nomor, "nomor")) + "</td><td>" + R(ph(p.wali, "nama")) + "</td><td>" + esc(hs.singkat) + (al ? ": " + esc(kecil(al)) : "") + '</td><td style="text-align:right;white-space:nowrap">' + (hs.pnbp ? rp(n) : "–") + "</td></tr>";
      }).join("") + '<tr><td colspan="4" style="text-align:right"><b>Jumlah PNBP</b></td><td style="text-align:right;white-space:nowrap"><b>' + rp(tot) + "</b></td></tr></table>";
  }

  /* D, E */
  h += Hd(0.75, "D.", "Simpulan dan Saran") + Hd(1.5, "1.", "Simpulan") + baris(T("simpulan")).map(function (s) { return P(1.5, R(s)); }).join("") + Hd(1.5, "2.", "Saran") + baris(T("saran")).map(function (s) { return P(1.5, R(s)); }).join("");
  h += Hd(0.75, "E.", "Penutup") + P(0.75, "Demikian laporan pelaksanaan tugas ini dibuat dengan sebenar-benarnya sebagai wujud transparansi dan pertanggungjawaban atas tugas yang telah diamanatkan.");

  /* tanda tangan */
  var sp = '<br><br><br>';
  var lain = S.tim.filter(function (_, i) { return i !== (+S.pj < S.tim.length ? +S.pj : 0); });
  h += '<table class="ttd"><tr><td></td><td style="text-align:left;padding-left:1.5cm">Dibuat di ' + esc(S.kota) + "<br>pada tanggal " + R(tgl(tLap, "tanggal laporan")) + "</td></tr>" +
    "<tr><td><br>" + R(ph(pj.jabatan, "jabatan")) + sp + "<br>" + R(ph(pj.nama, "nama")) + "</td><td>Mengetahui,<br>Kepala Balai Harta Peninggalan Medan" + sp + "<br>" + R(ph(S.kepala, "nama Kepala BHP")) + "</td></tr>" +
    lain.map(function (t) { return "<tr><td>" + sp + "<br>" + R(ph(t.nama, "nama")) + "</td><td></td></tr>"; }).join("") + "</table>";

  /* dokumentasi */
  var ft = S.krono.filter(function (k) { return k.foto; });
  if (ft.length) {
    h += PB + '<p class="ctr"><b>DOKUMENTASI</b></p><table class="foto">';
    ft.forEach(function (k, i) {
      var w = 290, hh = k.fw ? Math.round(w * k.fh / k.fw) : 218;
      var cap = "Foto " + (i + 1) + (k.jam ? " - Waktu: " + jam(k.jam) + " WIB, " + tgl(S.tglKegiatan) : "") + (k.lokasi.trim() ? " | Lokasi: " + k.lokasi.trim() : "") + (k.ket.trim() ? " - " + k.ket.trim() : "");
      if (i % 2 === 0) h += "<tr>";
      h += '<td><img src="' + (word ? "foto" + i + ".jpg" : k.foto) + '" width="' + w + '" height="' + hh + '" alt=""><br>' + R(cap) + "</td>";
      if (i % 2 === 1 || i === ft.length - 1) h += (i % 2 === 0 ? "<td></td>" : "") + "</tr>";
    });
    h += "</table>";
  }
  return h;
}

function renderPaper() {
  document.getElementById("paper").innerHTML = buildPaper(false);
  /* kotak naskah yang masih "otomatis" ikut diperbarui */
  Array.prototype.forEach.call(document.querySelectorAll("textarea[data-ov]"), function (ta) {
    var k = ta.getAttribute("data-ov"); if (S.ov[k] == null && document.activeElement !== ta) ta.value = AUTO[k]();
  });
}

/* =====================================================================
   INTERAKSI
   ===================================================================== */
var form = document.getElementById("form");
function semua() { simpan(); renderForm(); renderPaper(); }
form.addEventListener("input", function (e) {
  var el = e.target, k = el.getAttribute("data-k"), o = el.getAttribute("data-ov");
  if (o) { S.ov[o] = el.value; var tg = document.getElementById("tag-" + o); tg.textContent = "diedit manual"; tg.className = "tag man"; simpan(); renderPaper(); return; }
  if (el.hasAttribute("data-pj")) { S.pj = +el.getAttribute("data-pj"); simpan(); renderPaper(); return; }
  if (!k) return;
  set(k, el.type === "checkbox" ? el.checked : el.value);
  if (/\.hasil$/.test(k)) { set(k.replace(/hasil$/, "sub"), ""); set(k.replace(/hasil$/, "subLain"), ""); }
  if (k === "jenis") S.ov = {};
  simpan();
  if (el.hasAttribute("data-re")) renderForm();
  renderPaper();
});
form.addEventListener("change", function (e) {
  var el = e.target;
  if (el.id === "nPen") {
    var n = Math.max(1, Math.min(30, parseInt(el.value, 10) || 1));
    if (n < S.penetapan.length) {
      if (S.penetapan.slice(n).some(function (p) { return p.nomor || p.wali || p.anak; }) && !confirm("Penetapan " + (n + 1) + " dan seterusnya sudah diisi dan akan dihapus. Lanjutkan?")) { el.value = S.penetapan.length; return; }
      S.penetapan.length = n;
    }
    while (S.penetapan.length < n) S.penetapan.push(penetapanBaru());
    semua();
  }
  if (el.hasAttribute("data-foto") && el.files[0]) {
    var i = +el.getAttribute("data-foto"), rd = new FileReader();
    rd.onload = function () {
      var im = new Image();
      im.onload = function () {
        var sc = Math.min(1, 1100 / Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        S.krono[i].foto = c.toDataURL("image/jpeg", 0.82); S.krono[i].fw = c.width; S.krono[i].fh = c.height;
        semua();
      };
      im.onerror = function () { alert("Berkas ini tidak dapat dibaca sebagai gambar."); };
      im.src = rd.result;
    };
    rd.readAsDataURL(el.files[0]);
  }
});
form.addEventListener("click", function (e) {
  var a = e.target.getAttribute("data-act"); if (!a) return;
  var i = +e.target.getAttribute("data-i"), t;
  if (a === "addTim") S.tim.push({ nama: "", pangkat: "", nip: "", jabatan: "" });
  if (a === "delTim") { S.tim.splice(i, 1); if (+S.pj >= S.tim.length || +S.pj === i) S.pj = 0; else if (+S.pj > i) S.pj--; }
  if (a === "addPen") S.penetapan.push(penetapanBaru());
  if (a === "delPen") { if (!confirm("Hapus Penetapan " + (i + 1) + "?")) return; S.penetapan.splice(i, 1); }
  if (a === "addKr") S.krono.push({ jam: "", jam2: "", lokasi: "", uraian: "", foto: "", fw: 0, fh: 0, ket: "" });
  if (a === "delKr") { if ((S.krono[i].uraian || S.krono[i].foto) && !confirm("Hapus butir " + (i + 1) + "?")) return; S.krono.splice(i, 1); }
  if (a === "upKr") { t = S.krono[i]; S.krono[i] = S.krono[i - 1]; S.krono[i - 1] = t; }
  if (a === "dnKr") { t = S.krono[i]; S.krono[i] = S.krono[i + 1]; S.krono[i + 1] = t; }
  if (a === "delFoto") { S.krono[i].foto = ""; S.krono[i].ket = ""; }
  if (a === "autoKr") {
    if (S.krono.some(function (k) { return k.uraian.trim() || k.foto; }) && !confirm("Kronologi yang sudah diisi (termasuk foto) akan diganti dengan draf baru. Lanjutkan?")) return;
    S.krono = kronoAuto();
  }
  if (a === "resetOv") { var key = e.target.getAttribute("data-key"); if (S.ov[key] != null && !confirm("Buang suntingan manual pada bagian ini?")) return; delete S.ov[key]; }
  semua();
});
document.getElementById("btnPrint").onclick = function () { window.print(); };
document.getElementById("btnNew").onclick = function () {
  if (!confirm("Mulai laporan baru? Isian laporan ini dihapus; tim pelaksana, Kepala BHP, dan DIPA tetap disimpan.")) return;
  S = kosong(S); semua();
};

/* Unduh Word: berkas MHTML (.doc) supaya logo dan foto ikut tertanam */
document.getElementById("btnWord").onclick = function () {
  var css = "body{font:12pt/1.5 Arial,sans-serif}p{margin:0 0 6pt;text-align:justify}.ctr,.ctr p{text-align:center}.ph{color:#c00000}table{border-collapse:collapse}" +
    "table.b td,table.b th{border:1px solid #000;padding:3pt 5pt;vertical-align:top;font-size:10pt}table.kop{width:100%;border-bottom:3px double #000}table.kop td{text-align:center;vertical-align:middle}" +
    "table.ttd{width:100%}table.ttd td{width:50%;text-align:center;vertical-align:top}table.foto{width:100%}table.foto td{width:50%;text-align:center;vertical-align:top;font-size:9pt;padding:4pt}.pb{display:none}" +
    "@page{size:21cm 29.7cm;margin:2cm 2cm 2.5cm 3cm}";
  var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>' + css + "</style></head><body>" + buildPaper(true) + "</body></html>";
  function b64(s) { return btoa(unescape(encodeURIComponent(s))); }
  function lipat(s) { return s.replace(/(.{76})/g, "$1\r\n"); }
  var bd = "----=_BHP_LAPORAN", base = "file:///C:/laporan/", nl = "\r\n";
  function bagian(nama, tipe, data) { return "--" + bd + nl + "Content-Location: " + base + nama + nl + "Content-Transfer-Encoding: base64" + nl + "Content-Type: " + tipe + nl + nl + lipat(data) + nl + nl; }
  var out = "MIME-Version: 1.0" + nl + 'Content-Type: multipart/related; boundary="' + bd + '"' + nl + nl + bagian("laporan.htm", 'text/html; charset="utf-8"', b64(html)) + bagian("logo.png", "image/png", LOGO.split(",")[1]);
  S.krono.filter(function (k) { return k.foto; }).forEach(function (k, i) { out += bagian("foto" + i + ".jpg", "image/jpeg", k.foto.split(",")[1]); });
  out += "--" + bd + "--" + nl;
  var nama = "Laporan " + (S.jenis === "penyumpahan" ? "Penyumpahan " + (S.penetapan[0].wali.trim() || "") : jenisOf(S.jenis).label);
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], { type: "application/msword" }));
  a.download = nama.trim().replace(/[\/\\:*?"<>|]/g, "-") + (S.tglKegiatan ? " " + S.tglKegiatan : "") + ".doc";
  document.body.appendChild(a); a.click(); a.remove();
};
