<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pembuat Laporan Kegiatan · BHP Medan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f3efe6; --panel: #fff; --line: #e4dccb; --fg: #172033; --muted: #6a7183;
  --navy: #101b3f; --navy-2: #0a1230; --gold: #b8923f; --gold-2: #d9bd7a; --gold-3: #8f6f2a; --faint: #faf7f0;
  --ok: #1f6b3b; --bad: #9b2226; --warn: #8f6f2a;
  --serif: "Cormorant Garamond", "Palatino Linotype", Georgia, serif;
  --sans: "Inter", "Segoe UI", Calibri, Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); }
.topbar { background: radial-gradient(1200px 300px at 15% -40%, #23326b 0%, transparent 60%), linear-gradient(180deg, var(--navy), var(--navy-2)); color: #fff; border-bottom: 1px solid var(--gold); box-shadow: 0 1px 0 var(--gold-2) inset, 0 8px 30px rgba(10,18,48,.25); }
.topbar .in { max-width: 1600px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand img { width: 52px; height: 57px; border-radius: 8px; box-shadow: 0 0 0 1px var(--gold-2), 0 6px 18px rgba(0,0,0,.35); flex: none; }
.topbar .t1 { font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-2); font-weight: 600; }
.topbar .t2 { font: 600 25px/1.1 var(--serif); letter-spacing: .01em; }
.topbar .t3 { font-size: 12.5px; color: #c6cbe0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.status { font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 99px; background: rgba(255,255,255,.08); border: 1px solid rgba(217,189,122,.45); color: var(--gold-2); white-space: nowrap; }
.status.ok { color: #a8e0bd; border-color: rgba(168,224,189,.5); }
button { font: inherit; cursor: pointer; border-radius: 9px; border: 1px solid var(--line); background: #fff; color: var(--fg); padding: 8px 14px; font-weight: 600; font-size: 13.5px; transition: background .15s, box-shadow .15s, transform .05s; }
button:hover { background: var(--faint); }
button:active { transform: translateY(1px); }
button:disabled { opacity: .4; cursor: default; }
button.pri { background: linear-gradient(180deg, var(--gold-2), var(--gold)); border-color: var(--gold-3); color: var(--navy-2); box-shadow: 0 2px 8px rgba(184,146,63,.35); }
button.pri:hover { background: linear-gradient(180deg, #e4cc92, #c29d4b); }
button.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
button.ghost:hover { background: rgba(255,255,255,.1); }
.topbar select { width: auto; background: rgba(255,255,255,.06); color: #fff; border-color: rgba(255,255,255,.35); font-weight: 600; font-size: 13.5px; }
.topbar select option { color: var(--fg); }
button.sm { padding: 4px 10px; font-size: 12.5px; }
button.del { color: var(--bad); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.wrap { max-width: 1600px; margin: 0 auto; padding: 22px 24px 48px; display: grid; grid-template-columns: minmax(340px, 560px) minmax(0, 1fr); gap: 24px; align-items: start; }
.steps { display: flex; gap: 0; margin-bottom: 6px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; box-shadow: 0 6px 20px rgba(16,27,63,.06); }
.step { flex: 1; border: 0; background: none; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; color: var(--muted); font-size: 12px; font-weight: 600; }
.step:hover { background: none; color: var(--navy); }
.step::before { content: ""; position: absolute; top: 18px; left: -50%; width: 100%; height: 2px; background: var(--line); z-index: 0; }
.step:first-child::before { display: none; }
.step.on::before, .step.done::before { background: var(--gold); }
.step .n { position: relative; z-index: 1; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 2px solid var(--line); font: 700 13px var(--sans); color: var(--muted); }
.step.done .n { border-color: var(--gold); color: var(--gold-3); background: #fbf6e9; }
.step.on .n { border-color: var(--navy); background: var(--navy); color: var(--gold-2); box-shadow: 0 0 0 4px rgba(184,146,63,.22); }
.step.on { color: var(--navy); }
.lead { font: 500 19px/1.35 var(--serif); color: var(--navy); margin: 16px 4px 12px; }
.foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 4px; }
.foot button { padding: 11px 20px; font-size: 14.5px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 20px; margin-bottom: 14px; box-shadow: 0 6px 20px rgba(16,27,63,.06); }
.card > h2 { margin: 0 0 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); font: 600 21px var(--serif); color: var(--navy); display: flex; justify-content: space-between; align-items: center; gap: 8px; position: relative; }
.card > h2::after { content: ""; position: absolute; left: 0; bottom: -1px; width: 46px; height: 2px; background: var(--gold); }
label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; letter-spacing: .01em; }
label.chk { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--fg); }
label.chk input { width: auto; accent-color: var(--navy); }
input, select, textarea { width: 100%; font: inherit; padding: 9px 11px; border: 1px solid #d6cdb9; border-radius: 9px; background: #fff; color: var(--fg); transition: border-color .15s, box-shadow .15s; }
input:hover, select:hover, textarea:hover { border-color: var(--gold); }
input:focus, select:focus, textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(184,146,63,.18); outline: 0; }
input::placeholder, textarea::placeholder { color: #a9a596; }
textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
textarea.tall { min-height: 170px; }
.row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
.item { border: 1px solid var(--line); border-left: 3px solid var(--gold); border-radius: 11px; padding: 12px 14px 14px; margin-top: 12px; background: var(--faint); }
.item.ok { border-left-color: var(--ok); } .item.bad { border-left-color: var(--bad); } .item.warn { border-left-color: var(--warn); }
.item h3 { margin: 0; font: 600 17px var(--serif); color: var(--navy); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.item h3 span.b { display: flex; gap: 4px; align-items: center; font-family: var(--sans); }
.item h3 button, .card > h2 button { font-family: var(--sans); }
.hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
.count { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.count input { width: 80px; }
.ovh { display: flex; justify-content: space-between; align-items: end; gap: 8px; margin-top: 6px; }
.tag { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: #e6f1ea; color: var(--ok); }
.tag.man { background: #f6ecd6; color: var(--warn); }
.thumb { max-width: 150px; max-height: 105px; border-radius: 8px; border: 1px solid var(--line); display: block; margin-top: 8px; }
.preview { position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow: auto; padding: 18px; border-radius: 16px; background: linear-gradient(180deg, #1a2752, var(--navy-2)); box-shadow: inset 0 0 0 1px rgba(217,189,122,.35), 0 10px 30px rgba(10,18,48,.25); }
.preview::before { content: "PRATINJAU DOKUMEN"; display: block; text-align: center; font-size: 10.5px; letter-spacing: .28em; color: var(--gold-2); font-weight: 600; margin-bottom: 14px; }

/* ---- kertas ---- */
.paper { background: #fff; width: 210mm; max-width: 100%; margin: 0 auto; padding: 20mm 20mm 25mm 30mm; box-shadow: 0 10px 34px rgba(0,0,0,.4); color: #000; font: 12pt/1.5 Arial, Helvetica, sans-serif; }
.paper p { margin: 0 0 6pt; text-align: justify; }
.paper .ph { color: #c00000; }
.paper .ctr, .paper .ctr p { text-align: center; }
.paper .pb { border-top: 2px dashed #b9b2a4; margin: 18mm -20mm 18mm -30mm; height: 0; }
.paper .cover { text-align: center; min-height: 240mm; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
.paper table { border-collapse: collapse; }
.paper table.b td, .paper table.b th { border: 1px solid #000; padding: 3pt 5pt; vertical-align: top; font-size: 10pt; text-align: left; }
.paper table.b th { text-align: center; }
.paper table.kop { width: 100%; border-bottom: 3px double #000; margin-bottom: 14pt; }
.paper table.kop td { vertical-align: middle; text-align: center; padding-bottom: 6pt; line-height: 1.2; }
.paper table.ttd { width: 100%; margin-top: 10pt; }
.paper table.ttd td { width: 50%; vertical-align: top; text-align: center; padding: 0 6pt; }
.paper table.foto { width: 100%; }
.paper table.foto td { width: 50%; vertical-align: top; text-align: center; padding: 4pt 5pt 10pt; font-size: 9pt; line-height: 1.3; }
.paper table.foto img { max-width: 100%; height: auto; }
@media (max-width: 1000px) { .wrap { grid-template-columns: 1fr; padding: 16px 14px 40px; } .preview { position: static; max-height: none; padding: 10px; } .topbar .t2 { font-size: 21px; } .step .l { font-size: 10.5px; } .paper { padding: 12mm; } .paper .pb { margin: 12mm -12mm; } }
@media print {
  @page { size: A4; margin: 20mm 20mm 25mm 30mm; }
  body { background: #fff; } .topbar, .form { display: none !important; }
  .wrap { display: block; padding: 0; max-width: none; } .preview { position: static; max-height: none; overflow: visible; padding: 0; background: none; box-shadow: none; border-radius: 0; } .preview::before { display: none; }
  .paper { box-shadow: none; width: auto; padding: 0; }
  .paper .pb { border: 0; margin: 0; break-after: page; }
  .paper tr, .paper table.ttd, .paper table.foto td { break-inside: avoid; }
}
</style>
</head>
<body>
<div class="topbar"><div class="in">
  <div class="brand"><img id="brandLogo" alt="Logo Pengayoman"><div><div class="t1">Kementerian Hukum RI · Kantor Wilayah Sumatera Utara</div><div class="t2">Balai Harta Peninggalan Medan</div><div class="t3">Penyusun Laporan Kegiatan &amp; Surat Tugas</div></div></div>
  <div class="actions">
    <span class="status" id="status"></span>
    <select id="selDok" aria-label="Dokumen yang ditampilkan"><option value="laporan">Dokumen: Laporan Kegiatan</option><option value="st">Dokumen: Surat Tugas</option></select>
    <button class="pri" id="btnPrint">Cetak / Simpan PDF</button>
    <button class="ghost" id="btnWord">Unduh Word</button>
    <button class="ghost" id="btnNew">Laporan baru</button>
    <button class="ghost" id="btnAdmin" title="Khusus admin">Admin</button>
  </div>
</div></div>

<div class="wrap">
  <div class="form" id="form"></div>
  <div class="preview"><div class="paper" id="paper"></div></div>
</div>

    var n = Math.max(1, Math.min(30, parseInt(el.value, 10) || 1));
    if (n < S.penetapan.length) {
      if (S.penetapan.slice(n).some(function (p) { return p.nomor || p.wali || p.anak; }) && !confirm("Penetapan " + (n + 1) + " dan seterusnya sudah diisi dan akan dihapus. Lanjutkan?")) { el.value = S.penetapan.length; return; }
      S.penetapan.length = n;
    }
    while (S.penetapan.length < n) S.penetapan.push(penetapanBaru());
    semua();
  }
  if (el.id === "fotoBanyak") { unggahBanyak(el.files); return; }
  if (el.hasAttribute("data-ruj") && el.files[0]) { unggahRuj(el.getAttribute("data-ruj"), el.files[0]); return; }
  if (el.hasAttribute("data-foto") && el.files[0]) {
    var i = +el.getAttribute("data-foto");
    kecilkan(el.files[0], function (url, fw, fh) {
      if (!url) { alert("Berkas ini tidak dapat dibaca sebagai gambar."); return; }
      S.krono[i].foto = url; S.krono[i].fw = fw; S.krono[i].fh = fh; semua();
    });
  }
});
form.addEventListener("click", function (e) {
  var btn = e.target.closest("[data-act]"); if (!btn) return;
  var a = btn.getAttribute("data-act"), i = +btn.getAttribute("data-i"), t;
  if (a === "cetak") { if (bolehCetak()) window.print(); return; }
  if (a === "aiFoto") { aiFoto(); return; }
  if (a === "aiNaskah") { aiNaskah(); return; }
  if (a === "aiPosisi") { aiPosisi(); return; }
  if (a === "step") { S.step = i; simpan(); renderForm(); document.querySelector(".steps").scrollIntoView({ block: "nearest" }); return; }
  if (a === "addTim") S.tim.push({ nama: "", pangkat: "", nip: "", jabatan: "" });
  if (a === "delTim") { S.tim.splice(i, 1); if (+S.pj >= S.tim.length || +S.pj === i) S.pj = 0; else if (+S.pj > i) S.pj--; }
  if (a === "addPen") S.penetapan.push(penetapanBaru());
  if (a === "delPen") { if (!confirm("Hapus Penetapan " + (i + 1) + "?")) return; S.penetapan.splice(i, 1); }
  if (a === "addKr") S.krono.push({ jam: "", jam2: "", lokasi: "", uraian: "", foto: "", fw: 0, fh: 0, ket: "", tgl: "", grup: "" });
  if (a === "delKr") { if ((S.krono[i].uraian || S.krono[i].foto) && !confirm("Hapus butir " + (i + 1) + "?")) return; S.krono.splice(i, 1); }
  if (a === "upKr") { t = S.krono[i]; S.krono[i] = S.krono[i - 1]; S.krono[i - 1] = t; }
  if (a === "dnKr") { t = S.krono[i]; S.krono[i] = S.krono[i + 1]; S.krono[i + 1] = t; }
  if (a === "delFoto") { S.krono[i].foto = ""; S.krono[i].ket = ""; }
  if (a === "autoKr") {
    if (S.krono.some(function (k) { return k.uraian.trim() || k.foto; }) && !confirm("Kronologi yang sudah diisi (termasuk foto) akan diganti dengan draf baru. Lanjutkan?")) return;
    S.krono = kronoAuto();
  }
  if (a === "resetOv") { var key = btn.getAttribute("data-key"); if (S.ov[key] != null && !confirm("Buang suntingan manual pada bagian ini?")) return; delete S.ov[key]; }
  semua();
});

  var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>' + css + "</style></head><body>" + buildPaper(true) + "</body></html>";
  function b64(s) { return btoa(unescape(encodeURIComponent(s))); }
  function lipat(s) { return s.replace(/(.{76})/g, "$1\r\n"); }
  var bd = "----=_BHP_LAPORAN", base = "file:///C:/laporan/", nl = "\r\n";
  function bagian(nama, tipe, data) { return "--" + bd + nl + "Content-Location: " + base + nama + nl + "Content-Transfer-Encoding: base64" + nl + "Content-Type: " + tipe + nl + nl + lipat(data) + nl + nl; }
  var out = "MIME-Version: 1.0" + nl + 'Content-Type: multipart/related; boundary="' + bd + '"' + nl + nl + bagian("laporan.htm", 'text/html; charset="utf-8"', b64(html)) + bagian("logo.png", "image/png", LOGO.split(",")[1]);
  S.krono.filter(function (k) { return k.foto; }).forEach(function (k, i) { out += bagian("foto" + i + ".jpg", "image/jpeg", k.foto.split(",")[1]); });
  out += "--" + bd + "--" + nl;
  var nama = (S.dok === "st" ? "Surat Tugas " : "Laporan ") + (S.jenis === "penyumpahan" ? "Penyumpahan " + (S.penetapan[0].wali.trim() || "") : jenisOf(S.jenis).label);
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], { type: "application/msword" }));
  a.download = nama.trim().replace(/[\/\\:*?"<>|]/g, "-") + (S.tglKegiatan ? " " + S.tglKegiatan : "") + ".doc";
  document.body.appendChild(a); a.click(); a.remove();
};
