<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pembuat Laporan Kegiatan · BHP Medan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f3efe6; --panel: #fff; --line: #e4dccb; --fg: #172033; --muted: #6a7183;
  --navy: #101b3f; --navy-2: #0a1230; --gold: #b8923f; --gold-2: #d9bd7a; --gold-3: #8f6f2a; --faint: #faf7f0;
  --ok: #1f6b3b; --bad: #9b2226; --warn: #8f6f2a;
  --serif: "Cormorant Garamond", "Palatino Linotype", Georgia, serif;
  --sans: "Inter", "Segoe UI", Calibri, Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); }
.topbar { background: radial-gradient(1200px 300px at 15% -40%, #23326b 0%, transparent 60%), linear-gradient(180deg, var(--navy), var(--navy-2)); color: #fff; border-bottom: 1px solid var(--gold); box-shadow: 0 1px 0 var(--gold-2) inset, 0 8px 30px rgba(10,18,48,.25); }
.topbar .in { max-width: 1600px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand img { width: 52px; height: 57px; border-radius: 8px; box-shadow: 0 0 0 1px var(--gold-2), 0 6px 18px rgba(0,0,0,.35); flex: none; }
.topbar .t1 { font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-2); font-weight: 600; }
.topbar .t2 { font: 600 25px/1.1 var(--serif); letter-spacing: .01em; }
.topbar .t3 { font-size: 12.5px; color: #c6cbe0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.status { font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 99px; background: rgba(255,255,255,.08); border: 1px solid rgba(217,189,122,.45); color: var(--gold-2); white-space: nowrap; }
.status.ok { color: #a8e0bd; border-color: rgba(168,224,189,.5); }
button { font: inherit; cursor: pointer; border-radius: 9px; border: 1px solid var(--line); background: #fff; color: var(--fg); padding: 8px 14px; font-weight: 600; font-size: 13.5px; transition: background .15s, box-shadow .15s, transform .05s; }
button:hover { background: var(--faint); }
button:active { transform: translateY(1px); }
button:disabled { opacity: .4; cursor: default; }
button.pri { background: linear-gradient(180deg, var(--gold-2), var(--gold)); border-color: var(--gold-3); color: var(--navy-2); box-shadow: 0 2px 8px rgba(184,146,63,.35); }
button.pri:hover { background: linear-gradient(180deg, #e4cc92, #c29d4b); }
button.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
.topbar [hidden] { display: none !important; }
button.ghost:hover { background: rgba(255,255,255,.1); }
.topbar select { width: auto; background: rgba(255,255,255,.06); color: #fff; border-color: rgba(255,255,255,.35); font-weight: 600; font-size: 13.5px; }
.topbar select option { color: var(--fg); }
button.sm { padding: 4px 10px; font-size: 12.5px; }
button.del { color: var(--bad); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.wrap { max-width: 1600px; margin: 0 auto; padding: 22px 24px 48px; display: grid; grid-template-columns: minmax(340px, 560px) minmax(0, 1fr); gap: 24px; align-items: start; }
.steps { display: flex; gap: 0; margin-bottom: 6px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; box-shadow: 0 6px 20px rgba(16,27,63,.06); }
.step { flex: 1; border: 0; background: none; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; color: var(--muted); font-size: 12px; font-weight: 600; }
.step:hover { background: none; color: var(--navy); }
.step::before { content: ""; position: absolute; top: 18px; left: -50%; width: 100%; height: 2px; background: var(--line); z-index: 0; }
.step:first-child::before { display: none; }
.step.on::before, .step.done::before { background: var(--gold); }
.step .n { position: relative; z-index: 1; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 2px solid var(--line); font: 700 13px var(--sans); color: var(--muted); }
.step.done .n { border-color: var(--gold); color: var(--gold-3); background: #fbf6e9; }
.step.on .n { border-color: var(--navy); background: var(--navy); color: var(--gold-2); box-shadow: 0 0 0 4px rgba(184,146,63,.22); }
.step.on { color: var(--navy); }
.lead { font: 500 19px/1.35 var(--serif); color: var(--navy); margin: 16px 4px 12px; }
.foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 4px; }
.foot button { padding: 11px 20px; font-size: 14.5px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 20px; margin-bottom: 14px; box-shadow: 0 6px 20px rgba(16,27,63,.06); }
.card > h2 { margin: 0 0 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); font: 700 19px var(--serif); text-transform: uppercase; letter-spacing: .06em; color: var(--navy); display: flex; justify-content: space-between; align-items: center; gap: 8px; position: relative; }
.card > h2::after { content: ""; position: absolute; left: 0; bottom: -1px; width: 46px; height: 2px; background: var(--gold); }
label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; letter-spacing: .01em; }
label.chk { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--fg); }
label.chk input { width: auto; accent-color: var(--navy); }
input, select, textarea { width: 100%; font: inherit; padding: 9px 11px; border: 1px solid #d6cdb9; border-radius: 9px; background: #fff; color: var(--fg); transition: border-color .15s, box-shadow .15s; }
input:hover, select:hover, textarea:hover { border-color: var(--gold); }
input:focus, select:focus, textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(184,146,63,.18); outline: 0; }
input::placeholder, textarea::placeholder { color: #a9a596; }
textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
textarea.tall { min-height: 170px; }
.row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
.item { border: 1px solid var(--line); border-left: 3px solid var(--gold); border-radius: 11px; padding: 12px 14px 14px; margin-top: 12px; background: var(--faint); }
.item.ok { border-left-color: var(--ok); } .item.bad { border-left-color: var(--bad); } .item.warn { border-left-color: var(--warn); }
.item h3 { margin: 0; font: 600 17px var(--serif); color: var(--navy); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.item h3 span.b { display: flex; gap: 4px; align-items: center; font-family: var(--sans); }
.item h3 button, .card > h2 button { font-family: var(--sans); }
.hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
.count { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.count input { width: 80px; }
.ovh { display: flex; justify-content: space-between; align-items: end; gap: 8px; margin-top: 6px; }
.tag { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: #e6f1ea; color: var(--ok); }
.tag.man { background: #f6ecd6; color: var(--warn); }
.thumb { max-width: 150px; max-height: 105px; border-radius: 8px; border: 1px solid var(--line); display: block; margin-top: 8px; }
.preview { position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow: auto; padding: 18px; border-radius: 16px; background: linear-gradient(180deg, #1a2752, var(--navy-2)); box-shadow: inset 0 0 0 1px rgba(217,189,122,.35), 0 10px 30px rgba(10,18,48,.25); }
#paper { position: absolute; left: -10000px; top: 0; visibility: hidden; }
.preview { position: relative; }
.pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 12px; }
.pager button { min-width: 48px; padding: 8px 14px; font-size: 15px; background: rgba(255,255,255,.1); color: #fff; border-color: rgba(217,189,122,.6); }
.pager button:hover { background: rgba(255,255,255,.2); }
.pager button:disabled { opacity: .3; }
#halInfo { color: #fff; font-weight: 600; font-size: 14px; min-width: 120px; text-align: center; }
.paper.page { min-height: 297mm; }
.preview::before { content: "PRATINJAU DOKUMEN"; display: block; text-align: center; font-size: 10.5px; letter-spacing: .28em; color: var(--gold-2); font-weight: 600; margin-bottom: 14px; }

/* ---- bagian yang bisa dilipat ---- */
.lipat { margin-top: 10px; }
.lipat > summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px;
  font-size: 13.5px; font-weight: 600; color: var(--gold-3); background: #fbf6e9; border: 1px dashed var(--gold); user-select: none; }
.lipat > summary::-webkit-details-marker { display: none; }
.lipat > summary:hover { background: #f6ecd6; border-style: solid; }
.lipat > summary .ar { font-size: 11px; transition: transform .15s; }
.lipat[open] > summary { background: var(--navy); color: #fff; border: 1px solid var(--navy); }
.lipat[open] > summary .ar { transform: rotate(180deg); }
.lipat[open] { padding: 0 0 4px; }
.pen > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 600 17px var(--serif); color: var(--navy); }
.pen > summary::-webkit-details-marker { display: none; }
.pen > summary .pj::before { content: "▸ "; color: var(--gold); }
.pen[open] > summary .pj::before { content: "▾ "; }
.pen > summary .tag { font-family: var(--sans); white-space: nowrap; max-width: 52%; overflow: hidden; text-overflow: ellipsis; }
.unggah { display: inline-flex; align-items: center; justify-content: center; margin-top: 10px; padding: 11px 16px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--navy-2);
  background: linear-gradient(180deg, var(--gold-2), var(--gold)); border: 1px solid var(--gold-3); }
.unggah input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.unggah:focus-within { outline: 2px solid var(--navy); outline-offset: 2px; }
.ringkas { margin: 4px 0 0; padding: 10px 12px; background: var(--faint); border: 1px solid var(--line); border-radius: 10px; font-size: 14px; line-height: 1.6; }
.ringkas b { color: var(--navy); }

/* ---- layar masuk ---- */
.masuk { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; overflow: auto;
  background: radial-gradient(900px 500px at 20% 0%, #23326b 0%, transparent 60%), linear-gradient(180deg, var(--navy), var(--navy-2)); }
.masuk[hidden] { display: none; }
.masuk .kotak { width: 100%; max-width: 420px; background: #fff; border-radius: 18px; padding: 30px 28px 26px; text-align: center; box-shadow: 0 0 0 1px var(--gold-2), 0 20px 60px rgba(0,0,0,.45); }
.masuk img { width: 76px; height: 84px; border-radius: 10px; box-shadow: 0 0 0 1px var(--gold-2); }
.masuk .t1 { margin-top: 14px; font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-3); font-weight: 600; }
.masuk h1 { margin: 4px 0 2px; font: 600 27px/1.15 var(--serif); color: var(--navy); }
.masuk .t3 { color: var(--muted); font-size: 13.5px; margin-bottom: 20px; }
.masuk .pilih { display: grid; gap: 10px; text-align: left; }
.masuk .pilih > button { width: 100%; padding: 13px 16px; font-size: 15px; }
.masuk .garis { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin: 6px 0; }
.masuk .garis::before, .masuk .garis::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.masuk .galat { color: var(--bad); font-size: 13px; min-height: 18px; margin: 6px 0 0; }

/* ---- kertas ---- */
.paper { background: #fff; width: 210mm; max-width: 100%; margin: 0 auto; padding: 20mm 20mm 25mm 30mm; box-shadow: 0 10px 34px rgba(0,0,0,.4); color: #000; font: 12pt/1.5 Arial, Helvetica, sans-serif; }
.paper p { margin: 0 0 6pt; text-align: justify; }
.paper .ph { color: #c00000; }
.paper .ctr, .paper .ctr p { text-align: center; }
.paper .pb { border-top: 2px dashed #b9b2a4; margin: 18mm -20mm 18mm -30mm; height: 0; }
.paper .cover { text-align: center; min-height: 240mm; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
.paper table { border-collapse: collapse; }
.paper table.b td, .paper table.b th { border: 1px solid #000; padding: 3pt 5pt; vertical-align: top; font-size: 10pt; text-align: left; }
.paper table.b th { text-align: center; }
.paper table.kop { width: 100%; border-bottom: 3px double #000; margin-bottom: 14pt; }
.paper table.kop td { vertical-align: middle; text-align: center; padding-bottom: 6pt; line-height: 1.2; }
.paper table.ttd { width: 100%; margin-top: 10pt; }
.paper table.ttd td { width: 50%; vertical-align: top; text-align: center; padding: 0 6pt; }
.paper table.foto { width: 100%; }
.paper table.foto td { width: 50%; vertical-align: top; text-align: center; padding: 4pt 5pt 10pt; font-size: 9pt; line-height: 1.3; }
.paper table.foto img { max-width: 100%; height: auto; }
.mbar { display: none; }
@media (max-width: 1000px) {
  body { font-size: 15px; }
  /* bagian atas ringkas */
  .topbar .in { padding: 8px 12px; gap: 8px; flex-wrap: nowrap; }
  .brand { gap: 10px; } .brand img { width: 34px; height: 37px; }
  .topbar .t1, .topbar .t3 { display: none; } .topbar .t2 { font-size: 17px; white-space: nowrap; }
  .actions { gap: 6px; flex-wrap: nowrap; } .actions button { padding: 6px 10px; font-size: 12.5px; }
  .status, #btnNew { display: none; } .brand { min-width: 0; flex: 1; } .brand > div { min-width: 0; } .topbar .t2 { overflow: hidden; text-overflow: ellipsis; }
  /* satu layar: isi ATAU pratinjau, tidak bertumpuk ke bawah */
  .wrap { grid-template-columns: 1fr; padding: 0 12px 96px; gap: 0; }
  body:not(.lihat) .preview { display: none; }
  body.lihat .form { display: none; }
  .preview { position: static; max-height: none; padding: 8px; margin-top: 12px; border-radius: 12px; }
  .preview::before { margin-bottom: 8px; }
  .paper { padding: 20mm 20mm 25mm 30mm; width: 210mm; max-width: none; }
  /* langkah menempel di atas, tombol di bawah */
  .steps { position: sticky; top: 0; z-index: 20; margin: 0 -12px 0; border-radius: 0; border-width: 0 0 1px; padding: 8px 4px; }
  .step .l { font-size: 11px; } .step .n { width: 26px; height: 26px; font-size: 13px; } .step::before { top: 16px; }
  .lead { font-size: 16px; margin: 12px 2px 10px; }
  .card { padding: 14px 14px 16px; margin-bottom: 10px; border-radius: 12px; }
  .card > h2 { font-size: 19px; }
  .row { grid-template-columns: 1fr; gap: 0; }
  .form .foot { display: none; }
  .mbar { display: grid; grid-template-columns: 1fr 1.1fr 1fr; gap: 8px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.97); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(16,27,63,.12); }
  .mbar button { padding: 11px 8px; font-size: 14px; }
  .mbar .lihatBtn { background: var(--navy); color: #fff; border-color: var(--navy); }
}
@media print {
  @page { size: A4; margin: 20mm 20mm 25mm 30mm; }
  body { background: #fff; } .topbar, .form, .masuk, .mbar { display: none !important; } body .preview { display: block !important; } .paper { zoom: 1 !important; } .pager, #halaman { display: none !important; } #paper { position: static !important; visibility: visible !important; left: auto !important; }
  .wrap { display: block; padding: 0; max-width: none; } .preview { position: static; max-height: none; overflow: visible; padding: 0; background: none; box-shadow: none; border-radius: 0; } .preview::before { display: none; }
  .paper { box-shadow: none; width: auto; padding: 0; }
  .paper .pb { border: 0; margin: 0; break-after: page; }
  .paper tr, .paper table.ttd, .paper table.foto td { break-inside: avoid; }
}
</style>
</head>
<body>
<div class="masuk" id="masuk" hidden>
  <div class="kotak">
    <img id="masukLogo" alt="Logo Pengayoman">
    <div class="t1">Kementerian Hukum RI · Kanwil Sumatera Utara</div>
    <h1>Balai Harta Peninggalan Medan</h1>
    <div class="t3">Penyusun Laporan Kegiatan &amp; Surat Tugas</div>
    <div class="pilih">
      <button class="pri" id="masukPegawai">Masuk sebagai Pegawai</button>
      <div class="garis">atau</div>
      <label for="sandiMasuk" style="margin:0">Kata sandi admin</label>
      <input type="password" id="sandiMasuk" autocomplete="current-password" placeholder="Hanya untuk admin">
      <button id="masukAdminBtn">Masuk sebagai Admin</button>
      <p class="galat" id="masukGalat" role="alert"></p>
    </div>
  </div>
</div>
<div class="topbar"><div class="in">
  <div class="brand"><img id="brandLogo" alt="Logo Pengayoman"><div><div class="t1">Kementerian Hukum RI · Kantor Wilayah Sumatera Utara</div><div class="t2">Balai Harta Peninggalan Medan</div><div class="t3">Penyusun Laporan Kegiatan &amp; Surat Tugas</div></div></div>
  <div class="actions">
    <span class="status" id="status"></span>
    <select id="selDok" hidden aria-label="Dokumen yang ditampilkan"><option value="laporan">Dokumen: Laporan Kegiatan</option><option value="st">Dokumen: Surat Tugas</option></select>
    <button class="pri" id="btnPrint" hidden>Cetak / Simpan PDF</button>
    <button class="ghost" id="btnWord" hidden>Unduh Word</button>
    <button class="ghost" id="btnNew">Laporan baru</button>
    <button class="ghost" id="btnAdmin" title="Keluar dan kembali ke layar masuk">Keluar</button>
  </div>
</div></div>

<div class="wrap">
  <div class="form" id="form"></div>
  <div class="preview" id="previewBox">
    <div class="pager" id="pager"><button type="button" data-hal="-1" aria-label="Halaman sebelumnya">◀</button><span id="halInfo">Halaman 1 / 1</span><button type="button" data-hal="1" aria-label="Halaman berikutnya">▶</button></div>
    <div id="halaman"></div>
    <div class="paper" id="paper" aria-hidden="true"></div>
  </div>
</div>
<div class="mbar" id="mbar"></div>

<script>document.write('<script src="templates/naskah.js?v=' + Date.now() + '"><\/script><script src="templates/pegawai.js?v=' + Date.now() + '"><\/script>');</script>

    h += P(0.75, "Rekapitulasi hasil pelaksanaan:") + '<table class="b" style="margin-left:.75cm;margin-bottom:8pt"><tr><th>No.</th><th>Nomor Penetapan</th><th>Wali / Pengampu</th><th>Hasil</th><th>PNBP</th></tr>' +
      S.penetapan.map(function (p, i) {
        var hs = hasilOf(p.hasil), n = hs.pnbp ? angka(p.pnbp) : 0, al = hs.sub ? alasan(p) : ""; tot += n;
        return "<tr><td>" + (i + 1) + ".</td><td>" + R(ph(p.nomor, "nomor")) + "</td><td>" + R(ph(p.wali, "nama")) + "</td><td>" + esc(hs.singkat) + (al ? ": " + esc(kecil(al)) : "") + '</td><td style="text-align:right;white-space:nowrap">' + (hs.pnbp ? rp(n) : "–") + "</td></tr>";
      }).join("") + '<tr><td colspan="4" style="text-align:right"><b>Jumlah PNBP</b></td><td style="text-align:right;white-space:nowrap"><b>' + rp(tot) + "</b></td></tr></table>";
  }

  /* D, E */
  h += Hd(0.75, "D.", "Simpulan dan Saran") + Hd(1.5, "1.", "Simpulan") + baris(T("simpulan")).map(function (s) { return P(1.5, R(s)); }).join("") + Hd(1.5, "2.", "Saran") + baris(T("saran")).map(function (s) { return P(1.5, R(s)); }).join("");
  h += Hd(0.75, "E.", "Penutup") + P(0.75, "Demikian laporan pelaksanaan tugas ini dibuat dengan sebenar-benarnya sebagai wujud transparansi dan pertanggungjawaban atas tugas yang telah diamanatkan.");

  /* tanda tangan */
  var sp = '<br><br><br>';
  var lain = S.tim.filter(function (_, i) { return i !== (+S.pj < S.tim.length ? +S.pj : 0); });
  h += '<table class="ttd"><tr><td></td><td style="text-align:left;padding-left:1.5cm">Dibuat di ' + esc(S.kota) + "<br>pada tanggal " + R(tgl(tLap, "tanggal laporan")) + "</td></tr>" +
    "<tr><td><br>" + R(ph(pj.jabatan, "jabatan")) + sp + "<br>" + R(ph(pj.nama, "nama")) + "</td><td>Mengetahui,<br>Kepala Balai Harta Peninggalan Medan" + sp + "<br>" + R(ph(S.kepala, "nama Kepala BHP")) + "</td></tr>" +
    lain.map(function (t) { return "<tr><td>" + sp + "<br>" + R(ph(t.nama, "nama")) + "</td><td></td></tr>"; }).join("") + "</table>";

  /* dokumentasi */
  var ft = S.krono.filter(function (k) { return k.foto; });
  if (ft.length) {
    h += PB + '<p class="ctr"><b>DOKUMENTASI</b></p><table class="foto">';
    ft.forEach(function (k, i) {
      var w = 290, hh = k.fw ? Math.round(w * k.fh / k.fw) : 218;
      var cap = "Foto " + (i + 1) + (k.jam ? " - Waktu: " + jam(k.jam) + " WIB, " + tgl(k.tgl || S.tglKegiatan) : "") + (k.lokasi.trim() ? " | Lokasi: " + k.lokasi.trim() : "") + (k.ket.trim() ? " - " + k.ket.trim() : "");
      if (i % 2 === 0) h += "<tr>";
      h += '<td><img src="' + (word ? "foto" + i + ".jpg" : k.foto) + '" width="' + w + '" height="' + hh + '" alt=""><br>' + R(cap) + "</td>";
      if (i % 2 === 1 || i === ft.length - 1) h += (i % 2 === 0 ? "<td></td>" : "") + "</tr>";
    });
    h += "</table>";
  }
  return h;
}

/* Di layar HP, kertas A4 diperkecil agar pas selebar layar */
/* Pratinjau per halaman: isi #paper (tersembunyi) dipotong per halaman A4 di batas paragraf/tabel */
var HAL = 0, HALAMAN = [];
function potongHalaman() {
  var pp = document.getElementById("paper"), uk = document.createElement("div");
  uk.style.height = "252mm"; pp.appendChild(uk); var batas = uk.offsetHeight; pp.removeChild(uk);
  var pages = [[]], awal = null;
  Array.prototype.forEach.call(pp.children, function (el) {
    if (el.classList.contains("pb")) { pages.push([]); awal = null; return; }
    if (el.tagName === "BR") return;
    var atas = el.offsetTop, bawah = atas + el.offsetHeight;
    if (awal === null) awal = atas;
    var judul = el.tagName === "P" && el.firstElementChild && el.firstElementChild.tagName === "B" && el.textContent.trim().length < 90 || el.tagName === "P" && /:\s*$/.test(el.textContent) && el.textContent.trim().length < 140;
    if (bawah - awal > batas && pages[pages.length - 1].length) {
      /* judul bagian jangan tertinggal sendirian di bawah halaman */
      var lalu = pages[pages.length - 1], bawa = [];
      while (lalu.length > 1 && lalu[lalu.length - 1].judul) bawa.unshift(lalu.pop());
      pages.push(bawa); awal = bawa.length ? bawa[0].atas : atas;
    }
    pages[pages.length - 1].push({ html: el.outerHTML, judul: judul, atas: atas });
  });
  HALAMAN = pages.filter(function (x) { return x.length; }).map(function (x) { return x.map(function (y) { return y.html; }).join(""); });
  if (!HALAMAN.length) HALAMAN = [""];
  tampilHalaman(Math.min(HAL, HALAMAN.length - 1));
}
function tampilHalaman(n) {
  HAL = Math.max(0, Math.min(HALAMAN.length - 1, n));
  document.getElementById("halaman").innerHTML = '<div class="paper page">' + HALAMAN[HAL] + "</div>";
  document.getElementById("halInfo").textContent = "Halaman " + (HAL + 1) + " / " + HALAMAN.length;
  var bs = document.querySelectorAll("#pager button"); bs[0].disabled = HAL === 0; bs[1].disabled = HAL === HALAMAN.length - 1;
  pasKertas();
}
document.getElementById("pager").addEventListener("click", function (e) { var b = e.target.closest("[data-hal]"); if (b) tampilHalaman(HAL + +b.getAttribute("data-hal")); });
function pasKertas() {
  var pp = document.querySelector("#halaman .paper"), box = document.getElementById("previewBox");
  if (!pp) return;
  if (window.innerWidth > 1000) { pp.style.zoom = ""; return; }
  var w = (box.clientWidth || window.innerWidth - 24) - 16;
  pp.style.zoom = Math.min(1, w / 794).toFixed(3);
}
window.addEventListener("resize", function () { potongHalaman(); });
function renderPaper() {
  document.getElementById("paper").innerHTML = buildPaper(false);
  potongHalaman();
  var sisa = document.querySelectorAll("#paper .ph").length + kurangRuj().length, stEl = document.getElementById("status");
  stEl.textContent = sisa ? sisa + " isian belum lengkap" : "✓ Dokumen lengkap"; stEl.className = "status" + (sisa ? "" : " ok");
  /* kotak naskah yang masih "otomatis" ikut diperbarui */
  Array.prototype.forEach.call(document.querySelectorAll("textarea[data-ov]"), function (ta) {
    var k = ta.getAttribute("data-ov"); if (S.ov[k] == null && document.activeElement !== ta) ta.value = AUTO[k]();
  });
}

  if (el.hasAttribute("data-foto") && el.files[0]) {

});
form.addEventListener("click", function (e) {

  if (a === "addTim") S.tim.push({ nama: "", pangkat: "", nip: "", jabatan: "" });

  if (a === "addPen") S.penetapan.push(penetapanBaru());

  if (a === "delKr") { if ((S.krono[i].uraian || S.krono[i].foto) && !confirm("Hapus butir " + (i + 1) + "?")) return; S.krono.splice(i, 1); }
  if (a === "upKr") { t = S.krono[i]; S.krono[i] = S.krono[i - 1]; S.krono[i - 1] = t; }
  if (a === "dnKr") { t = S.krono[i]; S.krono[i] = S.krono[i + 1]; S.krono[i + 1] = t; }
  if (a === "delFoto") { S.krono[i].foto = ""; S.krono[i].ket = ""; }
  if (a === "autoKr") {
    if (S.krono.some(function (k) { return k.uraian.trim() || k.foto; }) && !confirm("Kronologi yang sudah diisi (termasuk foto) akan diganti dengan draf baru. Lanjutkan?")) return;
    S.krono = kronoAuto();
  }
  if (a === "resetOv") { var key = btn.getAttribute("data-key"); if (S.ov[key] != null && !confirm("Buang suntingan manual pada bagian ini?")) return; delete S.ov[key]; }
  semua();
});
